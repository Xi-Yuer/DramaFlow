services:
  upstream:
    image: ${B1_STUB_IMAGE:?固定测试 Python 镜像}
    entrypoint: [python]
    command: [/experiment/upstream.py]
    volumes: [.:/experiment:ro, '${B1_TEMP:?临时证书目录}:/certs:ro']
    networks:
      experiment:
        aliases: [api.openai.com, api.anthropic.com, endpoint-a, endpoint-b, other-host]
    read_only: true
    tmpfs: [/tmp]

  gateway:
    image: ${B1_IMAGE:?固定 Bifrost 镜像}
    entrypoint: [/app/main]
    command:
      [-host, 0.0.0.0, -port, '8080', -app-dir, /app/data, -log-level, warn, -log-style, json]
    environment:
      B1_GATEWAY_KEY: ${B1_GATEWAY_KEY:?合成平台凭证}
      SSL_CERT_FILE: /certs/server.crt
    volumes:
      [
        '.:/experiment:ro',
        '${B1_TEMP:?临时测试配置}/official.json:/app/data/config.json:ro',
        '${B1_TEMP:?临时证书目录}/server.crt:/certs/server.crt:ro',
      ]
    networks: [experiment]
    read_only: true
    tmpfs: [/tmp, '/app/data:uid=1000,gid=0,mode=0700']

  custom-gateway:
    extends: gateway
    volumes: ['${B1_TEMP:?临时测试配置}/custom.json:/app/data/config.json:ro']

  no-db-gateway:
    extends: gateway
    profiles: [admission]
    volumes: ['${B1_TEMP:?临时测试配置}/no-db.json:/app/data/config.json:ro']

  relay:
    image: ${B1_STUB_IMAGE:?固定测试 Python 镜像}
    entrypoint: [python]
    command: [/experiment/relay.py]
    volumes: [.:/experiment:ro]
    ports: [127.0.0.1::4100, 127.0.0.1::4101, 127.0.0.1::8080]
    networks: [experiment, access]
    read_only: true
    tmpfs: [/tmp]

networks:
  experiment:
    internal: true
  access: {}
