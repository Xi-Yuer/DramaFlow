services:
  upstream:
    image: ${L21_IMAGE:?固定 LiteLLM 镜像}
    entrypoint: [python]
    command: [/experiment/upstream.py]
    volumes: [.:/experiment:ro, '${L21_CERTS:?临时测试证书}:/certs:ro']
    networks:
      experiment:
        aliases: [other-host]
    read_only: true
    tmpfs: [/tmp]

  gateway:
    image: ${L21_IMAGE:?固定 LiteLLM 镜像}
    command:
      [
        --config,
        /experiment/config.yaml,
        --port,
        '4000',
        --num_workers,
        '1',
        --log_config,
        /safe/logging.json,
      ]
    environment:
      LITELLM_MASTER_KEY: ${L21_GATEWAY_KEY:?合成平台密钥}
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      LITELLM_TELEMETRY: 'False'
      DISABLE_ADMIN_UI: 'True'
      PYTHONPATH: /experiment:/safe
      SSL_VERIFY: /certs/server.crt
      SSL_CERT_FILE: /certs/server.crt
    volumes: [.:/experiment:ro, '../litellm-l2:/safe:ro', '${L21_CERTS:?临时测试证书}:/certs:ro']
    networks: [experiment]

  injected-gateway:
    extends: gateway
    environment:
      L21_CUSTOM_SESSION: '1'

  forward-gateway:
    extends: gateway
    environment:
      HTTP_PROXY: http://forward:8888
      HTTPS_PROXY: http://forward:8888
      NO_PROXY: ''

  httpx-gateway:
    extends: gateway
    environment:
      DISABLE_AIOHTTP_TRANSPORT: 'True'

  forward:
    image: ${L21_IMAGE:?固定 LiteLLM 镜像}
    entrypoint: [python]
    command: [/experiment/forward.py]
    volumes: [.:/experiment:ro]
    networks: [experiment]
    read_only: true
    tmpfs: [/tmp]

  relay:
    image: ${L21_IMAGE:?固定 LiteLLM 镜像}
    entrypoint: [python]
    command: [/experiment/relay.py]
    volumes: [.:/experiment:ro]
    ports: [127.0.0.1::4100, 127.0.0.1::4101, 127.0.0.1::4102, 127.0.0.1::4103, 127.0.0.1::8080]
    networks: [experiment, access]
    read_only: true
    tmpfs: [/tmp]

networks:
  experiment:
    internal: true
  access: {}
