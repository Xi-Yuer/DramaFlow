# 仅有协议级 wildcard；没有任何用户模型、endpoint 或厂商凭证。
model_list:
  - model_name: openai/*
    litellm_params:
      model: openai/*
      max_retries: 0
      configurable_clientside_auth_params:
        - api_base: ^http://upstream:8080/openai/(a|b)/v1$
  - model_name: anthropic/*
    litellm_params:
      model: anthropic/*
      max_retries: 0
      configurable_clientside_auth_params:
        - api_base: ^http://upstream:8080/anthropic/(a|b)$

router_settings:
  num_retries: 0
  fallbacks: []
  context_window_fallbacks: []
  content_policy_fallbacks: []

litellm_settings:
  set_verbose: false
  cache: false
  drop_params: false
  callbacks: []
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
  disable_spend_logs: true
