services:
  upstream:
    image: ${L1_GATEWAY_IMAGE:?由 run.mjs 从 image.lock.json 提供固定镜像}
    entrypoint: [python]
    command: [/experiment/upstream.py]
    volumes:
      - .:/experiment:ro
    networks: [experiment]
    read_only: true
    tmpfs: [/tmp]

  gateway:
    image: ${L1_GATEWAY_IMAGE:?由 run.mjs 从 image.lock.json 提供固定镜像}
    command: [--config, /experiment/config.yaml, --port, '4000', --num_workers, '1']
    environment:
      LITELLM_MASTER_KEY: ${L1_GATEWAY_KEY:?仅使用本轮随机生成的测试网关凭证}
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      LITELLM_TELEMETRY: 'False'
      DISABLE_ADMIN_UI: 'True'
    volumes:
      - .:/experiment:ro
    networks: [experiment]
    depends_on: [upstream]

  # Docker 的 internal 网络不发布 host port；此测试 relay 仅提供 loopback 入口。
  # Gateway 和 upstream 仍然只连接无外网出口的 experiment 网络。
  relay:
    image: ${L1_GATEWAY_IMAGE:?固定测试镜像}
    entrypoint: [python]
    command: [/experiment/relay.py]
    volumes: [.:/experiment:ro]
    ports: [127.0.0.1::4000, 127.0.0.1::4001, 127.0.0.1::4002, 127.0.0.1::8080]
    networks: [experiment, access]
    read_only: true
    tmpfs: [/tmp]

  gateway-debug:
    extends: gateway
    profiles: [diagnostics]
    command:
      [--config, /experiment/config.yaml, --port, '4000', --num_workers, '1', --detailed_debug]

  gateway-cache:
    extends: gateway
    profiles: [diagnostics]
    command: [--config, /probe/config.yaml, --port, '4000', --num_workers, '1']
    environment:
      PYTHONPATH: /experiment
    volumes:
      - ${L1_CACHE_CONFIG:?仅用于独立缓存探针的临时配置}:/probe/config.yaml:ro

networks:
  experiment:
    internal: true
  access: {}
