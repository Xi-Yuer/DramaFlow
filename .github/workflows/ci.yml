name: Verify
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:init
      - run: pnpm infra:up
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm auth:bootstrap
      - run: pnpm check
      - name: 隔离 HTTP / Worker / 持久化集成测试（不调用真实 AI）
        run: pnpm test:integration
      - name: 服务日志
        if: failure()
        run: docker compose logs --tail=100 postgres redis rustfs
      - name: 停止基础设施
        if: always()
        run: docker compose down
